name: Release to TestFlight

on:
  push:
    branches:
      - main
    paths-ignore:
      - "fastlane/metadata/**"
      - "fastlane/metadata_review_information.pending/**"
      - "fastlane/screenshots/**"
      - "marketing/**"
      - ".github/workflows/metadata.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Set up Ruby and cache Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build, sign, and upload to TestFlight
        run: bundle exec fastlane release
        env:
          APP_PROJECT: ${{ vars.APP_PROJECT }}
          APP_SCHEME: ${{ vars.APP_SCHEME }}
          APP_BUNDLE_ID: ${{ vars.APP_BUNDLE_ID }}
          APP_TEAM_ID: ${{ vars.APP_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
