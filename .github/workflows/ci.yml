name: CI

# This cloud-Mac build is the compiler feedback loop for Windows development.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Check dynamic framework embedding configuration
        run: node scripts/check-framework-embedding.mjs

      - name: Resolve Swift packages
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -project SMBDrop.xcodeproj \
            -scheme SMBDrop

      - name: Build SMBDrop
        run: |
          set -o pipefail
          xcodebuild \
            -project SMBDrop.xcodeproj \
            -scheme SMBDrop \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build

      - name: Verify dynamic framework is inside the app bundle
        run: |
          test -f \
            DerivedData/Build/Products/Debug-iphonesimulator/SMBDrop.app/Frameworks/AMSMB2.framework/AMSMB2
