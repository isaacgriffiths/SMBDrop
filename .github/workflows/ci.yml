name: CI

# This cloud-Mac build is the compiler feedback loop for Windows development.
on:
  push:
    branches: [main]
    paths-ignore:
      - "fastlane/metadata/**"
      - "fastlane/metadata_review_information.pending/**"
      - "fastlane/screenshots/**"
      - "marketing/**"
      - ".github/workflows/metadata.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Check dynamic framework embedding configuration
        run: node scripts/check-framework-embedding.mjs

      - name: Check shared transfer outbox target configuration
        run: node scripts/check-shared-outbox.mjs

      - name: Check folder browser and share upload wiring
        run: node scripts/check-transfer-features.mjs

      - name: Verify claims across separate processes
        shell: bash
        run: |
          set -euo pipefail
          probe_dir="$(mktemp -d)"
          trap 'rm -rf "$probe_dir"' EXIT

          xcrun swiftc \
            -parse-as-library \
            Shared/AppGroup.swift \
            Shared/Transfers/TransferOutbox.swift \
            scripts/transfer-outbox-process-probe.swift \
            -o "$probe_dir/transfer-outbox-probe"

          outbox_dir="$probe_dir/outbox"
          source_file="$probe_dir/source.mov"
          printf 'cross-process payload' > "$source_file"
          "$probe_dir/transfer-outbox-probe" \
            enqueue "$outbox_dir" "$source_file" "source.mov" > /dev/null

          "$probe_dir/transfer-outbox-probe" claim "$outbox_dir" > "$probe_dir/claim-one" &
          first_pid=$!
          "$probe_dir/transfer-outbox-probe" claim "$outbox_dir" > "$probe_dir/claim-two" &
          second_pid=$!
          wait "$first_pid"
          wait "$second_pid"

          claim_count="$(awk '$0 != "none" { count++ } END { print count + 0 }' \
            "$probe_dir/claim-one" "$probe_dir/claim-two")"
          test "$claim_count" -eq 1

      - name: Resolve Swift packages
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -project SMBDrop.xcodeproj \
            -scheme SMBDrop

      - name: Build SMBDrop
        run: |
          set -o pipefail
          xcodebuild \
            -project SMBDrop.xcodeproj \
            -scheme SMBDrop \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build

      - name: Verify dynamic framework is inside the app bundle
        run: |
          test -f \
            DerivedData/Build/Products/Debug-iphonesimulator/SMBDrop.app/Frameworks/AMSMB2.framework/AMSMB2

      - name: Run unit tests
        run: |
          SIMULATOR_UDID="$(python3 - <<'PY'
          import json
          import subprocess

          devices = json.loads(
              subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "--json"])
          )["devices"]
          for runtime, candidates in devices.items():
              if "SimRuntime.iOS" not in runtime:
                  continue
              for device in candidates:
                  if device.get("isAvailable"):
                      print(device["udid"])
                      raise SystemExit
          raise SystemExit("No available iOS simulator")
          PY
          )"
          xcrun simctl boot "$SIMULATOR_UDID" || true
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b
          xcodebuild \
            -project SMBDrop.xcodeproj \
            -scheme SMBDrop \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            test
