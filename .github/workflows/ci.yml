name: CI

# This cloud-Mac build is the compiler feedback loop for Windows development.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Check dynamic framework embedding configuration
        run: node scripts/check-framework-embedding.mjs

      - name: Check shared transfer outbox target configuration
        run: node scripts/check-shared-outbox.mjs

      - name: Resolve Swift packages
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -project SMBDrop.xcodeproj \
            -scheme SMBDrop

      - name: Build SMBDrop
        run: |
          set -o pipefail
          xcodebuild \
            -project SMBDrop.xcodeproj \
            -scheme SMBDrop \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build

      - name: Verify dynamic framework is inside the app bundle
        run: |
          test -f \
            DerivedData/Build/Products/Debug-iphonesimulator/SMBDrop.app/Frameworks/AMSMB2.framework/AMSMB2

      - name: Run unit tests
        run: |
          SIMULATOR_UDID="$(python3 - <<'PY'
          import json
          import subprocess

          devices = json.loads(
              subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "--json"])
          )["devices"]
          for runtime, candidates in devices.items():
              if "SimRuntime.iOS" not in runtime:
                  continue
              for device in candidates:
                  if device.get("isAvailable"):
                      print(device["udid"])
                      raise SystemExit
          raise SystemExit("No available iOS simulator")
          PY
          )"
          xcrun simctl boot "$SIMULATOR_UDID" || true
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b
          xcodebuild \
            -project SMBDrop.xcodeproj \
            -scheme SMBDrop \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            test
